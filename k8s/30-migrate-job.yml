apiVersion: batch/v1
kind: Job
metadata:
  name: worktracker-migrate
  namespace: worktracker
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.4-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres...";
                sleep 2;
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
      containers:
        - name: migrate
          image: worktracker-api:dev
          imagePullPolicy: Always
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: worktracker-config
            - secretRef:
                name: worktracker-secrets
