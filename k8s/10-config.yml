apiVersion: v1
kind: ConfigMap
metadata:
  name: worktracker-config
  namespace: worktracker
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "WorkTracker"
  Jwt__Audience: "WorkTracker.Users"
  Jwt__ExpirationMinutes: "60"
  # Frontend origin(s) allowed to call the API. Leave empty / remove
  # when the SPA is served from the same origin through an Ingress.
  Cors__AllowedOrigins__0: "https://worktracker.example.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: worktracker
data:
  POSTGRES_DB: "worktracker"
  POSTGRES_USER: "worktracker"
# Secret-y `worktracker-secrets` i `postgres-auth` są tworzone przez
# pipeline (.github/workflows/deploy.yml) z wartości w GitHub Actions
# (secrets.DB_PASSWORD, secrets.JWT_SECRET). Nie trzymamy ich w repo.
