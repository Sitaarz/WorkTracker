apiVersion: v1
kind: ConfigMap
metadata:
  name: worktracker-config
  namespace: worktracker
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "WorkTracker"
  Jwt__Audience: "WorkTracker.Users"
  Jwt__ExpirationMinutes: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: worktracker
data:
  POSTGRES_DB: "worktracker"
  POSTGRES_USER: "worktracker"
# The `worktracker-secrets` and `postgres-auth` secrets are created by the
# pipeline (.github/workflows/deploy.yml) from GitHub Actions values
# (secrets.DB_PASSWORD, secrets.JWT_SECRET). They are not stored in the repo.
