apiVersion: batch/v1
kind: Job
metadata:
  name: worktracker-migrate
  namespace: worktracker
  labels:
    app: worktracker-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: worktracker-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Tiny image + TCP check only — avoids pulling postgres client image (often large; flaky pulls show as "short read ... unexpected EOF").
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for TCP $POSTGRES_HOST:5432..."
              until nc -z -w 2 "$POSTGRES_HOST" 5432; do
                sleep 2
              done
              echo "postgres port is open"
          env:
            - name: POSTGRES_HOST
              value: postgres
      containers:
        - name: migrate
          image: worktracker-api:dev
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
