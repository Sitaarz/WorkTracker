apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktracker-api
  namespace: worktracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worktracker-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: worktracker-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: worktracker-api:dev
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: worktracker-config }
            - secretRef:    { name: worktracker-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: worktracker-api
  namespace: worktracker
spec:
  selector:
    app: worktracker-api
  ports:
    - port: 80
      targetPort: 8080
