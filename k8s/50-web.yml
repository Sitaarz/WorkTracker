apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktracker-web
  namespace: worktracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worktracker-web
  template:
    metadata:
      labels:
        app: worktracker-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: worktracker-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: worktracker-web
  namespace: worktracker
spec:
  selector:
    app: worktracker-web
  ports:
    - port: 80
      targetPort: 8080
