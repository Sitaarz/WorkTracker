apiVersion: apps/v1
kind: Deployment
metadata:
  name: worktracker-api
  namespace: worktracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worktracker-api
  template:
    metadata:
      labels:
        app: worktracker-api
    spec:
      containers:
        - name: api
          image: worktracker-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: worktracker-api
  namespace: worktracker
spec:
  selector:
    app: worktracker-api
  ports:
    - port: 80
      targetPort: 8080