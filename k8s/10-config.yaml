apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: worktracker
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: worktracker
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: worktracker
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=worktracker;Username=postgres;Password=postgres"
  Jwt__SecretKey: "change-me-to-a-long-random-string-in-production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: worktracker
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "WorkTracker"
  Jwt__Audience: "WorkTracker.Users"
  Jwt__ExpirationMinutes: "60"
  Cors__AllowedOrigins__0: "http://worktracker.local"