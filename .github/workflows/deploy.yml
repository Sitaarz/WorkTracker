name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names and tag
        id: meta
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="sha-${GITHUB_SHA::7}"
          {
            echo "IMAGE_API=ghcr.io/${OWNER_LC}/worktracker-api"
            echo "IMAGE_WEB=ghcr.io/${OWNER_LC}/worktracker-web"
            echo "TAG=${TAG}"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ env.TAG }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ env.TAG }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          : "${KUBE_CONFIG:?KUBE_CONFIG secret is not set}"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Apply manifests
        working-directory: k8s
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          dump_diagnostics() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Kubernetes diagnostics"
              kubectl -n worktracker get deploy,rs,job,pods -o wide || true
              kubectl -n worktracker describe deploy/worktracker-api || true
              kubectl -n worktracker describe deploy/worktracker-web || true
              kubectl -n worktracker describe pods -l app=worktracker-api || true
              kubectl -n worktracker describe pods -l app=worktracker-web || true
              kubectl -n worktracker logs -l app=worktracker-api --all-containers --tail=120 || true
              kubectl -n worktracker logs -l app=worktracker-web --all-containers --tail=120 || true
              kubectl -n worktracker describe job/worktracker-migrate || true
              kubectl -n worktracker logs job/worktracker-migrate --all-containers --tail=120 || true
              kubectl -n worktracker get events --sort-by=.lastTimestamp | tail -80 || true
              echo "::endgroup::"
            fi
            exit "$status"
          }
          trap dump_diagnostics EXIT

          : "${DB_PASSWORD:?DB_PASSWORD secret is not set}"
          : "${JWT_SECRET:?JWT_SECRET secret is not set}"

          kubectl create namespace worktracker \
            --dry-run=client -o yaml | kubectl apply -f -

          CONN="Host=postgres;Port=5432;Database=worktracker;Username=worktracker;Password=${DB_PASSWORD}"

          kubectl -n worktracker create secret generic worktracker-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="${CONN}" \
            --from-literal=Jwt__SecretKey="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n worktracker create secret generic postgres-auth \
            --from-literal=POSTGRES_PASSWORD="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "${GHCR_READ_TOKEN}" ]; then
            echo "::warning::GHCR_READ_TOKEN is not set; using GITHUB_TOKEN for this deployment. For private GHCR packages, create a long-lived token with read:packages and save it as GHCR_READ_TOKEN."
            GHCR_READ_TOKEN="${GITHUB_TOKEN}"
          fi

          kubectl -n worktracker create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USER}" \
            --docker-password="${GHCR_READ_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kustomize edit set image "worktracker-api=${IMAGE_API}:${TAG}"
          kustomize edit set image "worktracker-web=${IMAGE_WEB}:${TAG}"

          kubectl -n worktracker delete job worktracker-migrate --ignore-not-found
          kubectl apply -k .

          kubectl -n worktracker wait --for=condition=complete job/worktracker-migrate --timeout=5m
          kubectl -n worktracker rollout status deploy/worktracker-api --timeout=5m
          kubectl -n worktracker rollout status deploy/worktracker-web --timeout=5m
