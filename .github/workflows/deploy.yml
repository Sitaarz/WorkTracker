name: Build and deploy to Azure Kubernetes Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & push images to ACR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image-api: ${{ steps.meta.outputs.image-api }}
      image-web: ${{ steps.meta.outputs.image-web }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          REGISTRY="${{ vars.ACR_NAME }}.azurecr.io"
          TAG="sha-${GITHUB_SHA::7}"
          {
            echo "tag=${TAG}"
            echo "image-api=${REGISTRY}/worktracker-api"
            echo "image-web=${REGISTRY}/worktracker-web"
          } >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image-api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image-api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image-web }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image-web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Ensure namespace exists
        run: |
          kubectl create namespace worktracker \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply application secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          : "${DB_PASSWORD:?DB_PASSWORD secret is not set in GitHub Actions}"
          : "${JWT_SECRET:?JWT_SECRET secret is not set in GitHub Actions}"

          CONN="Host=postgres;Port=5432;Database=worktracker;Username=worktracker;Password=${DB_PASSWORD}"

          kubectl -n worktracker create secret generic worktracker-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="${CONN}" \
            --from-literal=Jwt__SecretKey="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n worktracker create secret generic postgres-auth \
            --from-literal=POSTGRES_PASSWORD="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin image tags in kustomization
        working-directory: k8s
        run: |
          kustomize edit set image \
            worktracker-api=${{ needs.build.outputs.image-api }}:${{ needs.build.outputs.tag }}
          kustomize edit set image \
            worktracker-web=${{ needs.build.outputs.image-web }}:${{ needs.build.outputs.tag }}

      - name: Bake manifests
        id: bake
        uses: azure/k8s-bake@v3
        with:
          renderEngine: kustomize
          kustomizationPath: k8s

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v5
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: |
            ${{ needs.build.outputs.image-api }}:${{ needs.build.outputs.tag }}
            ${{ needs.build.outputs.image-web }}:${{ needs.build.outputs.tag }}
