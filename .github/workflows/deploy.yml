name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/worktracker-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/worktracker-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          : "${KUBE_CONFIG:?KUBE_CONFIG secret is not set}"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Apply manifests
        working-directory: k8s
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          : "${DB_PASSWORD:?DB_PASSWORD secret is not set}"
          : "${JWT_SECRET:?JWT_SECRET secret is not set}"

          kubectl create namespace worktracker \
            --dry-run=client -o yaml | kubectl apply -f -

          CONN="Host=postgres;Port=5432;Database=worktracker;Username=worktracker;Password=${DB_PASSWORD}"

          kubectl -n worktracker create secret generic worktracker-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="${CONN}" \
            --from-literal=Jwt__SecretKey="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n worktracker create secret generic postgres-auth \
            --from-literal=POSTGRES_PASSWORD="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kustomize edit set image "worktracker-api=${IMAGE_API}:${TAG}"
          kustomize edit set image "worktracker-web=${IMAGE_WEB}:${TAG}"

          kubectl apply -k .

          kubectl -n worktracker rollout status deploy/worktracker-api --timeout=3m
          kubectl -n worktracker rollout status deploy/worktracker-web --timeout=3m
